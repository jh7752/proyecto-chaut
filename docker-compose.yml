services:
  api:
    build: .
    container_name: chaut-api
    restart: unless-stopped
    environment:
      CHAUT_ENVIRONMENT: dev
      CHAUT_FEE_PERCENT: "0.5"
      CHAUT_DATABASE_URL: sqlite:////data/chaut.db
      CHAUT_COINSENDA_MODE: script
      CHAUT_COINSENDA_RUNTIME_DIR: /app/vendor/coinsenda
      CHAUT_BYBIT_WORKER_INSTANCE_ID: ${CHAUT_BYBIT_WORKER_INSTANCE_ID:-}
      CHAUT_BYBIT_WORKER_REGION: ${CHAUT_BYBIT_WORKER_REGION:-ap-south-1}
    ports:
      - "80:8000"
    volumes:
      - chaut_data:/data

volumes:
  chaut_data:
