services:
  api:
    build: .
    container_name: chaut-api
    restart: unless-stopped
    environment:
      CHAUT_ENVIRONMENT: dev
      CHAUT_FEE_PERCENT: "0.5"
      CHAUT_DATABASE_URL: sqlite:////data/chaut.db
      CHAUT_ADMIN_TOKEN: ${CHAUT_ADMIN_TOKEN:-}
      CHAUT_ADMIN_USERNAME: ${CHAUT_ADMIN_USERNAME:-}
      CHAUT_ADMIN_PASSWORD: ${CHAUT_ADMIN_PASSWORD:-}
      CHAUT_ADMIN_SESSION_SECRET: ${CHAUT_ADMIN_SESSION_SECRET:-}
      CHAUT_COINSENDA_MODE: script
      CHAUT_COINSENDA_RUNTIME_DIR: /app/vendor/coinsenda
      CHAUT_KUCOIN_WORKER_INSTANCE_ID: ${CHAUT_KUCOIN_WORKER_INSTANCE_ID:-}
      CHAUT_KUCOIN_WORKER_REGION: ${CHAUT_KUCOIN_WORKER_REGION:-ap-south-1}
      CHAUT_HTX_WORKER_INSTANCE_ID: ${CHAUT_HTX_WORKER_INSTANCE_ID:-}
      CHAUT_HTX_WORKER_REGION: ${CHAUT_HTX_WORKER_REGION:-ap-south-1}
      SETICAP_USERNAME: ${SETICAP_USERNAME:-}
      SETICAP_PASSWORD: ${SETICAP_PASSWORD:-}
      HTX_KEY: ${HTX_KEY:-}
      HTX_SECRETKEY: ${HTX_SECRETKEY:-}
      KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
      KUCOIN_API_PASSPHRASE: ${KUCOIN_API_PASSPHRASE:-}
      KUCOIN_API_KEY_VERSION: ${KUCOIN_API_KEY_VERSION:-2}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    expose:
      - "8000"
    volumes:
      - chaut_data:/data

  caddy:
    image: caddy:2-alpine
    container_name: chaut-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  bot:
    build: .
    container_name: chaut-bot
    restart: unless-stopped
    command: ["python", "-m", "chaut_bot.telegram_bot"]
    environment:
      CHAUT_TELEGRAM_BOT_TOKEN: ${CHAUT_TELEGRAM_BOT_TOKEN:-}
      CHAUT_API_BASE: http://api:8000
    depends_on:
      - api

volumes:
  chaut_data:
  caddy_data:
  caddy_config:
