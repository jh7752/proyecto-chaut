AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Proyecto Chaut dev infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  GitHubOwner:
    Type: String
    Default: jh7752
  GitHubRepo:
    Type: String
    Default: proyecto-chaut

Globals:
  Function:
    Runtime: python3.11
    Architectures:
      - arm64
    Timeout: 20
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        CHAUT_ENVIRONMENT: !Ref Environment
        CHAUT_ORDERS_TABLE: !Ref OrdersTable
        CHAUT_EVENTS_TABLE: !Ref EventsTable
        CHAUT_FEE_PERCENT: '0.5'

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub chaut-${Environment}-api
      CodeUri: ../app/
      Handler: chaut_api.lambda_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chaut-${Environment}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: external_id
          AttributeType: S
      KeySchema:
        - AttributeName: external_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub chaut-${Environment}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entity_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: entity_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiUrl:
    Description: Proyecto Chaut API URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
  OrdersTableName:
    Value: !Ref OrdersTable
  EventsTableName:
    Value: !Ref EventsTable
